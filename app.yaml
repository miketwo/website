runtime: python313

handlers:
#root
- url: /
  static_files: static_website/index.html
  upload: static_website/index.html
  expiration: "0s"
  http_headers:
    Cache-Control: "no-cache, no-store, must-revalidate"

#serve home page in case index.html is requested
- url: /index.html
  static_files: static_website/index.html
  upload: static_website/index.html
  expiration: "0s"
  http_headers:
    Cache-Control: "no-cache, no-store, must-revalidate"

# Redirect to Educational Videos
- url: /learn/mocks
  script: auto

# Redirect to Blog
- url: /blog
  script: auto

# Dynamic resume
- url: /resume
  static_files: static_website/resume.html
  upload: static_website/resume.html
  expiration: "0s"
  http_headers:
    Cache-Control: "no-cache, no-store, must-revalidate"

# Print-oriented resume preview
- url: /resume-print.html
  static_files: static_website/resume-print.html
  upload: static_website/resume-print.html
  expiration: "0s"
  http_headers:
    Cache-Control: "no-cache, no-store, must-revalidate"

# Keep the stable PDF URL available for old bookmarks, but never let browsers
# or App Engine's frontend cache reuse an obsolete export.
- url: /downloads/resume\.pdf
  static_files: static_website/downloads/resume.pdf
  upload: static_website/downloads/resume.pdf
  expiration: "0s"
  http_headers:
    Cache-Control: "no-cache, no-store, must-revalidate"

#all static files return file if found,
#otherwise the default 404 page so it can be handled by sites that link
#directly to images.
- url: /(.*\.(gif|png|jpg|ico|bmp|css|otf|eot|svg|ttf|woff|js|pdf))
  static_files: static_website/\1
  upload: static_website/(.*\.(gif|png|jpg|ico|bmp|css|otf|eot|svg|ttf|woff|js|pdf))

#all other urls: return the 404 not found
- url: /.*
  static_files: static_website/not_found.html
  upload: static_website/not_found.html
