name: Deploy website

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: app-engine-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to App Engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.version_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: miketwo-original
          workload_identity_provider: projects/525388972744/locations/global/workloadIdentityPools/github-actions/providers/github-website
          service_account: github-actions-deploy@miketwo-original.iam.gserviceaccount.com

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: miketwo-original
          deliverables: app.yaml
          promote: true

      - name: Verify deployed version
        env:
          VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 "$VERSION_URL/"
